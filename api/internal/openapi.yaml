components:
  schemas: {}
info:
  description: Called only by web's server over the private network. Not a public API.
  title: Unset backend internal API
  version: 0.0.0
openapi: 3.1.2
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  status:
                    enum:
                      - ok
                      - unavailable
                    type: string
                required:
                  - status
                type: object
          description: Response for status 200
        "503":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  status:
                    enum:
                      - ok
                      - unavailable
                    type: string
                required:
                  - status
                type: object
          description: Response for status 503
      summary: "Readiness: whether backend can serve requests now"
      tags:
        - operations
