name: ci

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # tooling main after unset-sh/tooling#22 (Bun check).
    uses: unset-sh/tooling/.github/workflows/ci-check.yml@7cd2e8c3d284cd9bb90c54f336adc0834b515d97
    permissions:
      contents: read
      packages: read # the shared workflow's install step asks for it; no @unset-sh package is installed yet
    with:
      install: true
