components:
  schemas: {}
info:
  description: Called only by web's server over the private network. Not a public API.
  title: Unset backend internal API
  version: 0.0.0
openapi: 3.1.2
paths:
  /auth/sign-in/atproto:
    post:
      description: Wraps Better Auth's `auth.api.atprotoSignIn` (backend's server-only atproto plugin), so web codes against this contract and this error shape, not Better Auth's routes, which are not mounted.
      operationId: postAuthSign-inAtproto
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                handle:
                  maxLength: 253
                  minLength: 1
                  type: string
                nonce:
                  pattern: ^[A-Za-z0-9_-]{43}$
                  type: string
              required:
                - handle
                - nonce
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  url:
                    format: uri
                    type: string
                required:
                  - url
                type: object
          description: Response for status 200
        "400":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: handle_unverified
                    enum:
                      - handle_unverified
                      - handle_not_found
                      - identity_unavailable
                      - pds_unreachable
                      - failed
                      - invalid_request
                    type: string
                  status:
                    const: 400
                    type: number
                  title:
                    const: Bad Request
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 400
        "403":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: untrusted_origin
                    enum:
                      - untrusted_origin
                    type: string
                  status:
                    const: 403
                    type: number
                  title:
                    const: Forbidden
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 403
        "422":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: invalid_request
                    enum:
                      - invalid_request
                    type: string
                  status:
                    const: 422
                    type: number
                  title:
                    const: Unprocessable Content
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 422
        "500":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: failed
                    enum:
                      - failed
                    type: string
                  status:
                    const: 500
                    type: number
                  title:
                    const: Internal Server Error
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 500
        "502":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: handle_unverified
                    enum:
                      - handle_unverified
                      - handle_not_found
                      - identity_unavailable
                      - pds_unreachable
                      - failed
                    type: string
                  status:
                    const: 502
                    type: number
                  title:
                    const: Bad Gateway
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 502
        "503":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: handle_unverified
                    enum:
                      - handle_unverified
                      - handle_not_found
                      - identity_unavailable
                      - pds_unreachable
                      - failed
                    type: string
                  status:
                    const: 503
                    type: number
                  title:
                    const: Service Unavailable
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 503
      summary: "Start a sign-in: the authorization server's URL for a handle"
      tags:
        - auth
  /auth/sign-in/atproto/callback:
    post:
      description: "Wraps Better Auth's `auth.api.atprotoCallback`: it finds or creates the member for the DID the authorization server vouched for and starts a Better Auth session tied to that DID's token set."
      operationId: postAuthSign-inAtprotoCallback
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                nonce:
                  pattern: ^[A-Za-z0-9_-]{43}$
                  type: string
                query:
                  maxLength: 4096
                  minLength: 1
                  type: string
              required:
                - query
                - nonce
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  sessionToken:
                    minLength: 1
                    type: string
                required:
                  - sessionToken
                type: object
          description: Response for status 200
        "400":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: consent_denied
                    enum:
                      - consent_denied
                      - expired
                      - state_mismatch
                      - account_mismatch
                      - pds_unreachable
                      - failed
                      - scope_missing
                      - invalid_request
                    type: string
                  status:
                    const: 400
                    type: number
                  title:
                    const: Bad Request
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 400
        "403":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: untrusted_origin
                    enum:
                      - untrusted_origin
                    type: string
                  status:
                    const: 403
                    type: number
                  title:
                    const: Forbidden
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 403
        "422":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: invalid_request
                    enum:
                      - invalid_request
                    type: string
                  status:
                    const: 422
                    type: number
                  title:
                    const: Unprocessable Content
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 422
        "500":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: failed
                    enum:
                      - failed
                    type: string
                  status:
                    const: 500
                    type: number
                  title:
                    const: Internal Server Error
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 500
        "502":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: consent_denied
                    enum:
                      - consent_denied
                      - expired
                      - state_mismatch
                      - account_mismatch
                      - pds_unreachable
                      - failed
                      - scope_missing
                    type: string
                  status:
                    const: 502
                    type: number
                  title:
                    const: Bad Gateway
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 502
        "503":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: consent_denied
                    enum:
                      - consent_denied
                      - expired
                      - state_mismatch
                      - account_mismatch
                      - pds_unreachable
                      - failed
                      - scope_missing
                    type: string
                  status:
                    const: 503
                    type: number
                  title:
                    const: Service Unavailable
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 503
      summary: "Complete a sign-in from the callback query: a session token"
      tags:
        - auth
  /auth/sign-out:
    post:
      description: Wraps Better Auth's `auth.api.atprotoSignOut`, which deletes the session and revokes the AT Protocol grant; Better Auth's own sign-out would leave the grant, and the member's other sessions, in place.
      operationId: postAuthSign-out
      responses:
        "204":
          content:
            type: undefined
          description: Response for status 204
        "401":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: no_session
                    enum:
                      - no_session
                    type: string
                  status:
                    const: 401
                    type: number
                  title:
                    const: Unauthorized
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 401
        "403":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: untrusted_origin
                    enum:
                      - untrusted_origin
                    type: string
                  status:
                    const: 403
                    type: number
                  title:
                    const: Forbidden
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 403
        "500":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: failed
                    enum:
                      - failed
                    type: string
                  status:
                    const: 500
                    type: number
                  title:
                    const: Internal Server Error
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 500
        "503":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: failed
                    enum:
                      - failed
                    type: string
                  status:
                    const: 503
                    type: number
                  title:
                    const: Service Unavailable
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 503
      summary: End the caller's session and revoke the grant it rides on, which ends its other sessions too
      tags:
        - auth
  /health:
    get:
      description: "A probe, not a refusal: it answers its status document in both cases."
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  status:
                    default: ok
                    enum:
                      - ok
                      - unavailable
                    type: string
                required:
                  - status
                type: object
          description: Response for status 200
        "503":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  status:
                    default: ok
                    enum:
                      - ok
                      - unavailable
                    type: string
                required:
                  - status
                type: object
          description: Response for status 503
      summary: "Readiness: whether backend can serve requests now"
      tags:
        - operations
  /me/profile:
    get:
      description: "The session comes from Better Auth's `auth.api.getSession`; the profile is the caller's own `sh.unset.profile/self` record, read from their PDS over their OAuth session. The handle is present only when it resolves back to the DID. `session_ended`: the AT Protocol grant is gone, and every session on it with it."
      operationId: getMeProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  did:
                    minLength: 1
                    type: string
                  displayName:
                    minLength: 1
                    type: string
                  handle:
                    minLength: 1
                    type: string
                required:
                  - did
                type: object
          description: Response for status 200
        "401":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: no_session
                    enum:
                      - no_session
                      - session_ended
                    type: string
                  status:
                    const: 401
                    type: number
                  title:
                    const: Unauthorized
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 401
        "403":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: untrusted_origin
                    enum:
                      - untrusted_origin
                      - scope_missing
                    type: string
                  status:
                    const: 403
                    type: number
                  title:
                    const: Forbidden
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 403
        "500":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: failed
                    enum:
                      - failed
                    type: string
                  status:
                    const: 500
                    type: number
                  title:
                    const: Internal Server Error
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 500
        "502":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: failed
                    enum:
                      - failed
                    type: string
                  status:
                    const: 502
                    type: number
                  title:
                    const: Bad Gateway
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 502
        "503":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: pds_unreachable
                    enum:
                      - pds_unreachable
                    type: string
                  status:
                    const: 503
                    type: number
                  title:
                    const: Service Unavailable
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 503
      summary: "The caller's profile: DID, verified handle and display name"
      tags:
        - profile
    patch:
      description: "Reads the caller's `sh.unset.profile/self`, changes only `displayName` and writes it back with a compare-and-swap on the CID it read: a change made in between answers `conflict` and writes nothing. Every other field is kept. `record_invalid`: the stored record breaks the lexicon, so it is not written back under the caller's name."
      operationId: patchMeProfile
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                displayName:
                  maxLength: 640
                  type: string
              required:
                - displayName
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  did:
                    minLength: 1
                    type: string
                  displayName:
                    minLength: 1
                    type: string
                  handle:
                    minLength: 1
                    type: string
                required:
                  - did
                type: object
          description: Response for status 200
        "400":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: name_invalid
                    enum:
                      - name_invalid
                      - name_too_long
                      - invalid_request
                    type: string
                  status:
                    const: 400
                    type: number
                  title:
                    const: Bad Request
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 400
        "401":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: no_session
                    enum:
                      - no_session
                      - session_ended
                    type: string
                  status:
                    const: 401
                    type: number
                  title:
                    const: Unauthorized
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 401
        "403":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: untrusted_origin
                    enum:
                      - untrusted_origin
                      - scope_missing
                    type: string
                  status:
                    const: 403
                    type: number
                  title:
                    const: Forbidden
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 403
        "409":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: conflict
                    enum:
                      - conflict
                    type: string
                  status:
                    const: 409
                    type: number
                  title:
                    const: Conflict
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 409
        "422":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: invalid_request
                    enum:
                      - invalid_request
                    type: string
                  status:
                    const: 422
                    type: number
                  title:
                    const: Unprocessable Content
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 422
        "500":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: failed
                    enum:
                      - failed
                    type: string
                  status:
                    const: 500
                    type: number
                  title:
                    const: Internal Server Error
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 500
        "502":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: record_invalid
                    enum:
                      - record_invalid
                      - failed
                    type: string
                  status:
                    const: 502
                    type: number
                  title:
                    const: Bad Gateway
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 502
        "503":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: pds_unreachable
                    enum:
                      - pds_unreachable
                    type: string
                  status:
                    const: 503
                    type: number
                  title:
                    const: Service Unavailable
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 503
      summary: Set the caller's display name; an empty one removes it
      tags:
        - profile
  /me/session:
    get:
      description: Wraps Better Auth's `auth.api.getSession` (no cookie cache) as a cheap signed-in check that answers the DID alone, so web never sees Better Auth's session or user objects.
      operationId: getMeSession
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  did:
                    minLength: 1
                    type: string
                required:
                  - did
                type: object
          description: Response for status 200
        "401":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: no_session
                    enum:
                      - no_session
                    type: string
                  status:
                    const: 401
                    type: number
                  title:
                    const: Unauthorized
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 401
        "403":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: untrusted_origin
                    enum:
                      - untrusted_origin
                    type: string
                  status:
                    const: 403
                    type: number
                  title:
                    const: Forbidden
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 403
        "500":
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    default: failed
                    enum:
                      - failed
                    type: string
                  status:
                    const: 500
                    type: number
                  title:
                    const: Internal Server Error
                    type: string
                  type:
                    const: about:blank
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                type: object
          description: Response for status 500
      summary: "The caller's session: whose it is"
      tags:
        - auth
