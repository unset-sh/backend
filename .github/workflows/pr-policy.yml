name: pr-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions: {}

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    # tooling main after unset-sh/tooling#22.
    uses: unset-sh/tooling/.github/workflows/ci-pr-policy.yml@7cd2e8c3d284cd9bb90c54f336adc0834b515d97
    permissions:
      contents: read
      pull-requests: read
